# procmon service configuration
# Edit, then apply with: sudo systemctl restart procmon

# What to monitor: procmon options, separated by spaces.
#   -N name[,name...]   processes by name (looked up each time the service starts,
#                       so this keeps working after a reboot)
#   -p pid[,pid...]     processes by PID (PIDs change after a reboot)
# Both can be combined, e.g.: PROCMON_TARGET=-N sshd -p 1
PROCMON_TARGET=-N systemd,sshd

# Monitoring interval in seconds
PROCMON_INTERVAL=5
